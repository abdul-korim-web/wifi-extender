<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Abdul WiFi Extender – Login</title>
<link rel="stylesheet" href="style.css"/>
<style>
/* ── Login-specific overrides ─────────────────────────────────────────── */
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:2.5rem 2rem;width:100%;max-width:380px;text-align:center;
  box-shadow:0 8px 40px rgba(0,180,255,.08);}
.login-logo{font-size:2.4rem;margin-bottom:.25rem;}
.login-card h1{font-size:1.4rem;font-weight:700;color:var(--text-primary);margin:0 0 .25rem;}
.login-card p.sub{font-size:.8rem;color:var(--text-muted);margin:0 0 1.75rem;}
.form-group{text-align:left;margin-bottom:1rem;}
.form-group label{display:block;font-size:.75rem;color:var(--text-muted);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.05em;}
.form-group input{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--border);
  border-radius:8px;padding:.65rem .9rem;color:var(--text-primary);font-size:.95rem;outline:none;transition:border-color .2s;}
.form-group input:focus{border-color:var(--accent);}
.btn-login{width:100%;padding:.75rem;border-radius:8px;border:none;cursor:pointer;
  background:var(--gradient);color:#fff;font-size:1rem;font-weight:600;
  transition:opacity .2s;margin-top:.5rem;}
.btn-login:hover{opacity:.85;}
.error-msg{color:#ff6b6b;font-size:.82rem;margin-top:.75rem;display:none;}
.footer-credit{margin-top:2rem;font-size:.7rem;color:var(--text-muted);}
.footer-credit a{color:var(--accent);text-decoration:none;}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">📡</div>
  <h1>Abdul WiFi Extender</h1>
  <p class="sub">Admin Dashboard — Sign in to continue</p>

  <div class="form-group">
    <label>Username</label>
    <input type="text" id="user" placeholder="admin" autocomplete="username"/>
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password"/>
  </div>
  <button class="btn-login" id="loginBtn" onclick="doLogin()">Sign In</button>
  <p class="error-msg" id="errMsg">Invalid username or password.</p>

  <div class="footer-credit">
    Developed by <a href="https://github.com/abdul-korim-web" target="_blank">Abdul Korim</a>
  </div>
</div>

<script>
// If already logged in, redirect
if(sessionStorage.getItem('token')) location.href='/dashboard.html';

async function doLogin(){
  const btn=document.getElementById('loginBtn');
  const err=document.getElementById('errMsg');
  const user=document.getElementById('user').value.trim();
  const pass=document.getElementById('pass').value;
  if(!user||!pass){err.textContent='Please fill in all fields.';err.style.display='block';return;}
  btn.disabled=true; btn.textContent='Signing in…';
  try{
    const r=await fetch('/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user,pass})
    });
    const d=await r.json();
    if(d.ok){
      sessionStorage.setItem('token',d.token);
      location.href='/dashboard.html';
    } else {
      err.textContent=d.error||'Invalid credentials.';
      err.style.display='block';
    }
  }catch(e){
    err.textContent='Connection error. Try again.';
    err.style.display='block';
  }
  btn.disabled=false; btn.textContent='Sign In';
}

// Allow Enter key
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
</body>
</html>
