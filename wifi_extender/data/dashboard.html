<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Dashboard – Abdul WiFi Extender</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- ── Shell injected by JS ──────────────────────────────────────────────── -->
<div id="shell"></div>

<!-- ── Page content ──────────────────────────────────────────────────────── -->
<template id="pageContent">
  <!-- Status row -->
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card">
      <div class="stat-card-top">
        <span class="stat-card-label">Internet</span>
        <span class="stat-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>
          </svg>
        </span>
      </div>
      <div class="stat-card-value" id="statInternet">—</div>
      <div class="stat-card-sub" id="statStaSsid">Upstream SSID</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-top">
        <span class="stat-card-label">Repeater</span>
        <span class="stat-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12.55a11 11 0 0114.08 0"/><path d="M1.42 9a16 16 0 0121.16 0"/>
            <path d="M8.53 16.11a6 6 0 016.95 0"/><circle cx="12" cy="20" r="1" fill="currentColor"/>
          </svg>
        </span>
      </div>
      <div class="stat-card-value" id="statRepeater">—</div>
      <div class="stat-card-sub" id="statApSsid">Extended SSID</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-top">
        <span class="stat-card-label">Signal (RSSI)</span>
        <span class="stat-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
        </span>
      </div>
      <div class="stat-card-value" id="statRssi">—</div>
      <div class="stat-card-sub" id="statRssiLabel">dBm</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-top">
        <span class="stat-card-label">Clients</span>
        <span class="stat-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
            <circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/>
            <path d="M16 3.13a4 4 0 010 7.75"/>
          </svg>
        </span>
      </div>
      <div class="stat-card-value" id="statClients">—</div>
      <div class="stat-card-sub">Connected devices</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-top">
        <span class="stat-card-label">Free Heap</span>
        <span class="stat-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <path d="M8 21h8M12 17v4"/>
          </svg>
        </span>
      </div>
      <div class="stat-card-value" id="statHeap">—</div>
      <div class="stat-card-sub">bytes free</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-top">
        <span class="stat-card-label">Uptime</span>
        <span class="stat-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
        </span>
      </div>
      <div class="stat-card-value uptime-str" id="statUptime">—</div>
      <div class="stat-card-sub">since last boot</div>
    </div>
  </div>

  <!-- Two-column info cards -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
    <div class="card">
      <div class="card-header"><h2>Network Info</h2></div>
      <div class="card-body">
        <table class="info-table">
          <tr><td>Local IP</td><td id="infoLocalIp">—</td></tr>
          <tr><td>AP IP</td><td id="infoApIp">—</td></tr>
          <tr><td>MAC Address</td><td id="infoMac">—</td></tr>
          <tr><td>Router SSID</td><td id="infoStaSsid">—</td></tr>
          <tr><td>Extended SSID</td><td id="infoApSsid">—</td></tr>
        </table>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><h2>Device Health</h2></div>
      <div class="card-body">
        <div style="font-size:.78rem;color:var(--text-muted);margin-bottom:.4rem;">Heap Memory</div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="heapBar" style="width:0%"></div>
        </div>
        <div id="heapBarLabel" style="font-size:.72rem;color:var(--text-muted);margin-top:.3rem;"></div>
        <br/>
        <div style="font-size:.78rem;color:var(--text-muted);margin-bottom:.4rem;">Signal Strength</div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="rssiBar" style="width:0%"></div>
        </div>
        <div id="rssiBarLabel" style="font-size:.72rem;color:var(--text-muted);margin-top:.3rem;"></div>
      </div>
    </div>
  </div>
</template>

<!-- Toast + Confirm -->
<div id="toast"></div>
<div class="modal-overlay" id="confirmOverlay">
  <div class="modal">
    <h3 id="confirmTitle">Confirm</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="confirmCancel">Cancel</button>
      <button class="btn btn-danger" id="confirmOk">Confirm</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
requireAuth();

// Inject shell
document.getElementById('shell').innerHTML = renderShell('dashboard','Dashboard','Real-time overview of your WiFi extender') +
  document.getElementById('pageContent').innerHTML +
  '</div></div></div>';

initSidebar();

const FREE_HEAP_MAX = 50000; // approximate max for ESP8266 ~50 KB

async function refreshStatus() {
  try {
    const r = await apiFetch('/api/status');
    const d = await r.json();
    if (!d.ok) return;

    // Status cards
    document.getElementById('statInternet').innerHTML =
      `<span class="badge ${d.internet?'online':'offline'}"><span class="dot"></span>${d.internet?'Online':'Offline'}</span>`;
    document.getElementById('statRepeater').innerHTML =
      `<span class="badge ${d.repeater?'online':'offline'}"><span class="dot"></span>${d.repeater?'Active':'Inactive'}</span>`;
    document.getElementById('statStaSsid').textContent = d.sta_ssid || 'Not connected';
    document.getElementById('statApSsid').textContent  = d.ap_ssid  || '—';

    const rssi = d.rssi;
    document.getElementById('statRssi').textContent = d.internet ? (rssi + ' dBm') : '—';
    document.getElementById('statRssiLabel').textContent = d.internet ? rssiLabel(rssi) : '—';

    document.getElementById('statClients').textContent = d.clients;
    document.getElementById('statHeap').textContent    = d.free_heap.toLocaleString();
    document.getElementById('statUptime').textContent  = formatUptime(d.uptime_s);

    // Info table
    document.getElementById('infoLocalIp').textContent = d.local_ip || '—';
    document.getElementById('infoApIp').textContent    = d.ap_ip    || '—';
    document.getElementById('infoMac').textContent     = d.mac      || '—';
    document.getElementById('infoStaSsid').textContent = d.sta_ssid || '—';
    document.getElementById('infoApSsid').textContent  = d.ap_ssid  || '—';

    // Heap bar
    const heapPct = Math.min(100, Math.round((d.free_heap / FREE_HEAP_MAX) * 100));
    document.getElementById('heapBar').style.width = heapPct + '%';
    document.getElementById('heapBarLabel').textContent =
      formatBytes(d.free_heap) + ' free (~' + heapPct + '%)';

    // RSSI bar  –100dBm=0%, -40dBm=100%
    const rssiPct = d.internet ? Math.min(100, Math.max(0, Math.round(((rssi + 100) / 60) * 100))) : 0;
    document.getElementById('rssiBar').style.width = rssiPct + '%';
    document.getElementById('rssiBarLabel').textContent =
      d.internet ? (rssi + ' dBm — ' + rssiLabel(rssi)) : 'No upstream connection';

  } catch(e) { /* network error — silent */ }
}

refreshStatus();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
